<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel pedidos | Somos Cantera</title>
  <style>
    :root{--bg:#f6f7f4;--panel:#fff;--text:#172019;--muted:#657066;--green:#35651f;--line:#d9dfd4;--warn:#b7791f;--ok:#2f855a;--blue:#2b6cb0}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;position:sticky;top:0;z-index:5}
    .bar{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
    h1{font-size:22px;margin:0;color:var(--green)}
    main{max-width:1480px;margin:22px auto;padding:0 12px}
    .login,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 32px rgba(25,36,28,.08)}
    .login{max-width:420px;margin:80px auto}
    label{display:block;font-weight:800;margin-bottom:8px}
    input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:12px;background:white}
    button,.btn{border:0;border-radius:9px;padding:8px 10px;background:var(--green);color:white;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;font-size:12px}
    button.secondary,.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--green)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .muted{color:var(--muted);font-size:11px}
    .table-wrap{overflow-x:hidden;border:1px solid var(--line);border-radius:14px;background:white}
    table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0}
    th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12px;overflow:hidden;text-overflow:ellipsis}
    th{background:#f0f3ed;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.25px}
    tr:hover{background:#fbfcfa}
    .estado{font-weight:900;border-radius:999px;padding:4px 7px;display:inline-block;font-size:11px;margin-top:5px}
    .pendiente{background:#fff4d6;color:var(--warn)}
    .pagado{background:#dff7ea;color:var(--ok)}
    .generando{background:#e8e4ff;color:#553c9a}
    .generado{background:#d6f5ff;color:#056174}
    .enviado{background:#dceeff;color:var(--blue)}
    img.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
    img.generated-thumb{width:52px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:block;margin-bottom:4px}
    .hidden{display:none}
    .error{color:#a61b1b;font-weight:800;margin-top:12px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
    .modal img{max-width:92vw;max-height:88vh;border-radius:14px;background:white}
    .modal.visible{display:flex}

    .col-num{width:54px}
    .col-fecha{width:78px}
    .col-cliente{width:105px}
    .col-cromo{width:90px}
    .col-deporte{width:70px}
    .col-tamano{width:62px}
    .col-pack{width:82px}
    .col-hab{width:135px}
    .col-total{width:68px}
    .col-estado{width:88px}
    .col-foto{width:62px}
    .col-generado{width:95px}
    .col-indicaciones{width:58px}
    .compact-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .habilidades{font-size:11px;line-height:1.25}
    .indicaciones-btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;color:var(--green);font-weight:800;cursor:help}

  </style>
</head>
<body>
<header><div class="bar"><h1>Panel de pedidos · Somos Cantera</h1><button id="logoutBtn" class="secondary hidden">Salir</button></div></header>
<main>
  <section id="loginBox" class="login">
    <h2>Acceso privado</h2>
    <p class="muted">Introduce la contraseña de administración.</p>
    <label>Contraseña</label>
    <input id="passwordInput" type="password" placeholder="Contraseña">
    <div style="margin-top:14px"><button id="loginBtn">Entrar</button></div>
    <div id="loginError" class="error"></div>
  </section>
  <section id="panelBox" class="panel hidden">
    <div class="actions">
      <button id="refreshBtn">Actualizar pedidos</button>
      <a id="excelBtn" class="btn secondary" href="#">Descargar Excel</a>
      <span id="countText" class="muted"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-num">Nº</th><th class="col-fecha">Fecha</th><th class="col-cliente">Cliente</th><th class="col-cromo">Cromo</th><th class="col-deporte">Deporte</th><th class="col-tamano">Tamaño</th><th class="col-pack">Pack</th><th class="col-hab">Habilidades</th><th class="col-total">Total</th><th class="col-estado">Estado</th><th class="col-foto">Foto</th><th class="col-generado">Generado</th><th class="col-indicaciones">Notas</th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="imageModal" class="modal"><img id="modalImg" src="" alt="Foto pedido"></div>
<script>
let adminPassword = localStorage.getItem('SC_ADMIN_PASSWORD') || '';
const loginBox = document.getElementById('loginBox');
const panelBox = document.getElementById('panelBox');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const refreshBtn = document.getElementById('refreshBtn');
const excelBtn = document.getElementById('excelBtn');
const ordersBody = document.getElementById('ordersBody');
const countText = document.getElementById('countText');
const loginError = document.getElementById('loginError');
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');
function qsPassword(){return encodeURIComponent(adminPassword)}
function fechaCorta(fecha){
  if(!fecha) return '';
  const partes=String(fecha).split(',');
  const fechaParte=(partes[0]||'').trim();
  const horaParte=(partes[1]||'').trim().slice(0,5);
  return `${fechaParte}<br><span class="muted">${horaParte}</span>`;
}
function habilidadesLinea(texto){
  return String(texto||'').replace(/,/g,' · ');
}
function titulo(texto){
  return String(texto||'').replace(/"/g,'&quot;');
}
function showPanel(){loginBox.classList.add('hidden');panelBox.classList.remove('hidden');logoutBtn.classList.remove('hidden');excelBtn.href=`/api/admin-excel?password=${qsPassword()}`;cargarPedidos()}
function logout(){localStorage.removeItem('SC_ADMIN_PASSWORD');adminPassword='';panelBox.classList.add('hidden');logoutBtn.classList.add('hidden');loginBox.classList.remove('hidden')}
async function cargarPedidos(){
  ordersBody.innerHTML='<tr><td colspan="13">Cargando...</td></tr>';
  const res=await fetch(`/api/admin-pedidos?password=${qsPassword()}`);
  const data=await res.json();
  if(!res.ok){ordersBody.innerHTML=`<tr><td colspan="13">Error: ${data.error || 'No se han podido cargar los pedidos'}</td></tr>`;return}
  countText.textContent=`${data.pedidos.length} pedidos`;
  ordersBody.innerHTML='';
  data.pedidos.forEach(p=>{
    const tr=document.createElement('tr');
    const estado=p.estado || 'pendiente';
    tr.innerHTML=`
      <td class="col-num"><strong>${p.numero_pedido || ''}</strong></td>
      <td class="col-fecha">${fechaCorta(p.fecha)}</td>
      <td class="col-cliente compact-text" title="${titulo((p.nombre || '') + ' · ' + (p.equipo || ''))}">${p.nombre || ''}</td>
      <td class="col-cromo compact-text" title="${titulo(p.tipo_cromo || '')}">${p.tipo_cromo || ''}</td>
      <td class="col-deporte compact-text">${p.deporte || '-'}</td>
      <td class="col-tamano">${p.tamano || ''}</td>
      <td class="col-pack compact-text" title="${titulo(p.pack_album || 'NO')}">${p.pack_album || 'NO'}</td>
      <td class="col-hab habilidades" title="${titulo(p.habilidades || '')}">${habilidadesLinea(p.habilidades)}</td>
      <td class="col-total"><strong>${Number(p.total || 0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</strong></td>
      <td class="col-estado"><select data-id="${p.id}" class="estadoSelect"><option value="pendiente" ${estado==='pendiente'?'selected':''}>Pendiente</option><option value="pagado" ${estado==='pagado'?'selected':''}>Pagado</option><option value="generando" ${estado==='generando'?'selected':''}>Generando</option><option value="generado" ${estado==='generado'?'selected':''}>Generado</option><option value="enviado" ${estado==='enviado'?'selected':''}>Enviado</option></select><div><span class="estado ${estado}">${estado}</span></div></td>
      <td class="col-foto">${p.tiene_foto ? `<img class="thumb" src="/api/admin-foto?id=${p.id}&password=${qsPassword()}" data-full="/api/admin-foto?id=${p.id}&password=${qsPassword()}">` : '-'}</td>
      <td class="col-generado">${p.tiene_generado ? `<img class="generated-thumb" src="/api/admin-generado?id=${p.id}&password=${qsPassword()}" data-full="/api/admin-generado?id=${p.id}&password=${qsPassword()}"><a class="btn secondary" style="padding:6px 8px;font-size:12px" href="/api/admin-generado?id=${p.id}&password=${qsPassword()}&download=1">PNG</a><button class="btn enviarCromoBtn" data-id="${p.id}" data-cliente="${p.nombre || ''}" style="padding:6px 8px;font-size:12px;margin-left:4px">Enviar</button><br><span class="muted">${p.generado_archivo || ''}</span>` : (p.generado_archivo ? `<strong>✅ Generado</strong><br><span class="muted">${p.generado_archivo}</span>` : '-')}</td>
      <td class="col-indicaciones">${p.indicaciones ? `<span class="indicaciones-btn" title="${titulo(p.indicaciones)}">📝</span>` : '-'}</td>`;
    ordersBody.appendChild(tr);
  });
  document.querySelectorAll('.estadoSelect').forEach(sel=>{sel.addEventListener('change',async()=>{await fetch('/api/admin-estado',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adminPassword,id:sel.dataset.id,estado:sel.value})});cargarPedidos()})});
  document.querySelectorAll('img.thumb, img.generated-thumb').forEach(img=>{img.addEventListener('click',()=>{modalImg.src=img.dataset.full;modal.classList.add('visible')})});
  document.querySelectorAll('.enviarCromoBtn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const cliente=btn.dataset.cliente || 'el cliente';
      if(!confirm(`¿Enviar el cromo generado por email a ${cliente}?`)) return;
      btn.disabled=true;
      btn.textContent='Enviando...';
      try{
        const res=await fetch('/api/enviar-cromo',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:adminPassword,id:btn.dataset.id})
        });
        const data=await res.json();
        if(!res.ok) throw new Error(data.error || 'No se pudo enviar el email');
        alert('Cromo enviado correctamente al cliente.');
        cargarPedidos();
      }catch(error){
        alert(error.message || 'Error enviando el cromo.');
        btn.disabled=false;
        btn.textContent='Enviar';
      }
    });
  });
}
loginBtn.addEventListener('click',async()=>{adminPassword=passwordInput.value.trim();loginError.textContent='';const res=await fetch(`/api/admin-pedidos?password=${qsPassword()}`);if(!res.ok){loginError.textContent='Contraseña incorrecta o error de conexión.';return}localStorage.setItem('SC_ADMIN_PASSWORD',adminPassword);showPanel()});
logoutBtn.addEventListener('click',logout);
refreshBtn.addEventListener('click',cargarPedidos);
modal.addEventListener('click',()=>modal.classList.remove('visible'));
if(adminPassword) showPanel();
</script>
</body>
</html>
