<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pedido | Somos Cantera</title><link rel="stylesheet" href="css/styles.css"><style>body{background:#fff;color:#111}.order{padding:70px 0;background:#f6f6f6}.box{max-width:820px;margin:auto;background:white;border-top:8px solid #ffd200;padding:38px;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.12)}.box h1{font-family:'Barlow Condensed',Arial,sans-serif;font-size:54px;text-transform:uppercase;font-style:italic;margin-bottom:10px}.form{display:grid;gap:16px}.form label{display:grid;gap:7px;font-size:13px;text-transform:uppercase;font-weight:900}.form input,.form select,.form textarea{padding:14px;border:1px solid #d8d8d8;border-radius:4px;font:inherit}.form button{border:0;cursor:pointer;margin-top:10px}</style></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo"><img src="img/logo-somos-cantera.svg"></a><nav class="main-nav"><a href="index.html">Volver al inicio</a></nav><a href="index.html#contacto" class="header-cta">Contacto clubes</a></div></header><main class="order"><div class="container"><div class="box"><p class="section-kicker">Pedido individual</p><h1>Pedir cromo personalizado</h1><p>Formulario básico listo para conectar con Stripe o con tu pasarela de pago.</p><form class="form" action="gracias.html"><label>Nombre del jugador<input required></label><label>Equipo / club<input required></label><label>Dorsal<input type="number"></label><label>Modelo<select><option>Cromo individual digital - 6€</option><option>Cromo impreso - 10€</option><option>Pack equipo - presupuesto</option><option>Álbum de club - presupuesto</option></select></label><label>Datos adicionales<textarea rows="5"></textarea></label><button class="btn btn-primary">Continuar pedido</button></form></div></div></main></body></html>
